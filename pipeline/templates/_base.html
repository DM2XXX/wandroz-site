<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="5DCj9gpYkJtNZmnLGFZkmzduyZr8bO2YDMeZ5vhS8nI" />
<title>{% block title %}Wandroz — Neighbourhood safety for travellers{% endblock %}</title>
<meta name="description" content="{% block description %}Wandroz shows travellers which city neighbourhoods are genuinely safe, using public official data instead of just reviews.{% endblock %}">
<link rel="canonical" href="{{ canonical_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wandroz">
<meta property="og:title" content="{% block og_title %}Wandroz — Neighbourhood safety for travellers{% endblock %}">
<meta property="og:description" content="{% block og_description %}Wandroz shows travellers which city neighbourhoods are genuinely safe, using public official data instead of just reviews.{% endblock %}">
<meta property="og:url" content="{{ canonical_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{% block twitter_title %}Wandroz — Neighbourhood safety for travellers{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}Wandroz shows travellers which city neighbourhoods are genuinely safe, using public official data instead of just reviews.{% endblock %}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap { max-width: 840px; margin: 0 auto; padding: 0 24px 60px; }
  /* Stessa scala a gradini della mappa e della home: la misura di base riempie
     un telefono, su uno schermo grande si legge minuta. La colonna si allarga
     insieme al testo, altrimenti crescendo i caratteri le righe si accorciano
     e la pagina diventa piu' lunga a parita' di contenuto. */
  @media (min-width: 721px){
    .wrap { max-width: 960px; }
    h1 { font-size: 36px; }
    h2 { font-size: 22px; margin: 36px 0 14px; }
    h3 { font-size: 18px; }
    .subtitle { font-size: 18px; max-width: 660px; line-height:1.5; }
    .hero .eyebrow { font-size: 14px; padding:6px 14px; }
    table.breakdown { font-size: 15.5px; }
    .faq-item summary { font-size: 16.5px; }
    .faq-item p { font-size: 15.5px; }
    .card strong, .card b { font-size: 17px; }
  }
  @media (min-width: 1800px){
    .wrap { max-width: 1180px; }
    h1 { font-size: 46px; }
    h2 { font-size: 28px; }
    h3 { font-size: 22px; }
    .subtitle { font-size: 22px; max-width: 820px; }
    table.breakdown { font-size: 18.5px; }
    .faq-item summary { font-size: 20px; }
    .faq-item p { font-size: 18.5px; }
    .card strong, .card b { font-size: 20.5px; }
  }
  /* La colonna di testo non insegue lo schermo oltre un certo punto: una riga
     di 150 caratteri non si legge, si scansiona. Oltre quella soglia cresce
     solo il corpo, che e' quello che serviva. */
  @media (min-width: 2400px){
    .wrap { max-width: 1320px; }
    h1 { font-size: 52px; }
    h2 { font-size: 31px; }
    .subtitle { font-size: 24px; max-width: 900px; }
    .faq-item summary { font-size: 22px; }
    .faq-item p { font-size: 20.5px; }
    .card strong, .card b { font-size: 22.5px; }
  }
  h1 { font-size: 30px; margin: 0 0 8px; font-weight:800; }
  h2 { font-size: 19px; margin: 32px 0 12px; font-weight:700; }
  .subtitle { color: var(--muted); margin-bottom: 8px; font-size:15.5px; max-width:560px; }
  .list-item { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .list-item:last-child{ border-bottom:none; }

  .hero { padding: 48px 0 8px; }
  .hero .eyebrow { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color: var(--accent); background: var(--accent-bg); padding:5px 12px; border-radius:20px; margin-bottom:18px; letter-spacing:0.02em; }

  table.breakdown { width:100%; border-collapse:collapse; font-size: 13.5px; margin-top:10px; }
  table.breakdown th, table.breakdown td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }

  .faq { display:flex; flex-direction:column; gap:8px; margin-bottom: 10px; }
  .faq-item { border:1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px; background:#fff; }
  .faq-item summary { font-size:14.5px; font-weight:600; cursor:pointer; list-style:none; }
  .faq-item summary::-webkit-details-marker { display:none; }
  .faq-item summary::before { content:"+ "; color: var(--muted); }
  .faq-item[open] summary::before { content:"– "; }
  .faq-item p { font-size:13.5px; color:#3a3f4d; line-height:1.6; margin:10px 0 2px; }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E36MYT740L"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-E36MYT740L');
</script>
<script defer src="/booking-events.js"></script>
</head>
<body>
<header class="wz-header">
  <a class="wz-brand" href="/">
    <img class="wz-logo" src="/logo-mark.png" alt="Wandroz" width="38" height="38">
    <div><div class="wz-name">Wandroz</div></div>
  </a>
  <nav class="wz-nav">
    <a href="/">Home</a>
    <a href="/methodology.html">Methodology</a>
  </nav>
</header>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
<footer class="wz-footer">Wandroz — public official data, not just reviews. In beta — coverage is expanding. · <a href="/methodology.html">Methodology</a> · <a href="/about.html">About</a> · <a href="/privacy.html">Privacy</a> · <a href="/affiliate-disclosure.html">Affiliate disclosure</a> · <a href="/contact.html">Contact</a></footer>
</body>
</html>
