name: Production release (Phase 2 — one commit, one deployment)

# WHAT THIS IS
#   The only workflow in this repository that can write to main. It turns an
#   approved source branch into ONE production commit containing both the
#   source changes and the dist/ generated from exactly that source, so
#   Vercel performs exactly one production deployment and production is never
#   left in a half-updated state.
#
# WHY ONE COMMIT AND NOT A MERGE
#   Vercel serves the committed dist/. Merging source alone would deploy the
#   OLD dist with the NEW source — an internally inconsistent production —
#   and the rebuild would then be a second deployment. On a plan with a daily
#   production-deployment cap, halving that matters; correctness matters more.
#
# WHY IT CANNOT SHIP SOMETHING THE GATE REJECTED
#   The build, the QA gate and the commit all happen in this one job, against
#   one checkout. There is no window in which a human could substitute a
#   different artefact between "passed QA" and "published". If the gate fails,
#   the job exits before the commit step and main is untouched.
#
# SAFETY
#   - workflow_dispatch only. Never runs on push.
#   - Requires typing RELEASE into the confirm input; any other value aborts.
#   - Refuses to run unless the QA gate and the reproducibility check pass.
#   - Verifies production afterwards and fails loudly if what is live does
#     not match what was built.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit to release from"
        required: true
        default: "reproducibility/phase1"
      confirm:
        description: "Type RELEASE to confirm a production deployment"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "RELEASE" ]; then
            echo "::error::confirm was '${{ inputs.confirm }}', expected RELEASE. Nothing was done."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record the pre-release state (for rollback)
        run: |
          echo "PREV_MAIN=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Rollback target: $(git rev-parse HEAD)"

      - name: Take the approved source
        run: |
          git fetch origin "${{ inputs.source_ref }}"
          SRC=$(git rev-parse FETCH_HEAD)
          echo "SRC_SHA=$SRC" >> "$GITHUB_ENV"
          # Source of truth only. dist/ is NOT taken from the branch — it is
          # rebuilt below, so the published output cannot be a stale artefact
          # someone committed by hand.
          # The branch's trees replace main's, deletions included. Checking out
          # paths on top of main only adds and updates: a file the branch
          # deleted survived into the build, which is how a renamed sights file
          # came back as an orphan and failed the gate.
          # data/ is source too. It holds the scores the pages are built from,
          # and leaving it out meant a release could publish a rebuild of the
          # generator against last month's numbers: London kept saying
          # April-June after its scores had been refreshed to May-July on the
          # branch, because the branch's data never travelled with it.
          rm -rf pipeline .github data
          git checkout "$SRC" -- pipeline .github data
          # .gitignore sits at the root, so it is not inside any of the three
          # trees above and would never travel with a release: main would keep
          # having no .gitignore no matter how many times the branch fixed it.
          # Taken conditionally because an unconditional checkout of a missing
          # path makes git exit non-zero and fail the whole release — releasing
          # from a branch cut before .gitignore existed has to keep working,
          # and in that case main's current one simply stays in place.
          if git cat-file -e "$SRC:.gitignore" 2>/dev/null; then
            git checkout "$SRC" -- .gitignore
            echo "  .gitignore taken from the source branch"
          else
            echo "  note: $SRC has no .gitignore; keeping main's"
          fi
          echo "Source taken from $SRC"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Clean build into an empty candidate directory
        run: |
          mkdir -p candidate
          cp -R pipeline candidate/pipeline
          cp -R data candidate/data
          python3 candidate/pipeline/build_site.py
          echo "candidate pages: $(find candidate/dist -name '*.html' | wc -l)"

      - name: QA gate
        run: python3 candidate/pipeline/qa_full_site.py --dist candidate/dist --report-dir qa_output

      - name: Reproducibility gate
        run: |
          python3 candidate/pipeline/verify_reproducible.py \
            --dist candidate/dist --compare-against dist --report-dir qa_output

      - name: Upload the gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: qa_output/

      - name: Publish — ONE commit containing source + its own build
        run: |
          rm -rf dist
          mv candidate/dist dist
          rm -rf candidate
          git config user.name "wandroz-release"
          git config user.email "release@wandroz.com"
          # .gitignore is listed explicitly: this add is path-scoped, so a
          # root-level file left out of it never reaches the release commit.
          # Conditionally, though, exactly like the checkout above: naming a
          # path that exists nowhere makes git exit 128 and kills the release,
          # which is what happened on the first release cut from a branch that
          # predated the .gitignore.
          git add -A pipeline .github data dist
          if [ -f .gitignore ]; then git add -A .gitignore; fi
          if git diff --cached --quiet; then
            echo "::error::nothing to release — main already matches this build"
            exit 1
          fi
          echo "files in this release: $(git diff --cached --name-only | wc -l)"
          git commit -m "Release: canonical rebuild from ${SRC_SHA} (source + generated dist)"
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for Vercel, then verify production
        run: |
          # Vercel builds on the push above. Poll the live site until the new
          # build is serving, then assert on it. A timeout here means the
          # deployment did not land — main is already updated, so use the
          # rollback in the release notes rather than re-running.
          ok=0
          for i in $(seq 1 40); do
            sleep 15
            if curl -sf --max-time 20 https://www.wandroz.com/firenze/centro.html >/dev/null 2>&1 \
               && curl -sf --max-time 20 https://www.wandroz.com/sitemap.xml 2>/dev/null \
                  | grep -q 'firenze/centro.html'; then
              ok=1; echo "production is serving the new build (attempt $i)"; break
            fi
            echo "  waiting for the deployment… ($i/40)"
          done
          [ "$ok" = "1" ] || { echo "::error::production did not pick up the release within 10 minutes"; exit 1; }

      - name: Assert production matches what was built
        run: |
          fail=0
          check() { # name expected actual
            if [ "$2" = "$3" ]; then echo "  ok   $1: $3"
            else echo "  FAIL $1: expected $2, got $3"; fail=1; fi
          }
          curl -s --max-time 30 https://www.wandroz.com/sitemap.xml -o /tmp/sm.xml
          # Compare production against the build that was just published, not
          # against a number typed here a month ago: this assertion failed a
          # release for finding 1,241 URLs where it expected 1,237, which was
          # four new pages doing exactly what they were supposed to do.
          check "sitemap URLs" "$(grep -c '<loc>' dist/sitemap.xml)" "$(grep -c '<loc>' /tmp/sm.xml)"
          curl -s --max-time 30 https://www.wandroz.com/ -o /tmp/home.html
          check "'Official boundaries' on homepage" "0" "$(grep -c 'Official boundaries' /tmp/home.html || true)"
          curl -s --max-time 30 https://www.wandroz.com/berlin/adlershof.html -o /tmp/p.html
          check "legacy email on a sample page" "0" "$(grep -c 'dadenuoto@gmail.com' /tmp/p.html || true)"
          check "stale day/night copy"          "0" "$(grep -c 'both figures shown are the same' /tmp/p.html || true)"
          # The labels themselves are the generator's business, so read them
          # from it rather than retyping them here: this assertion failed a
          # release once for spelling a label the site had already renamed,
          # after production had already been updated correctly.
          OFFICIAL_LABEL=$(python3 -c "import sys; sys.path.insert(0,'pipeline'); import build_site as b; print(b.EVIDENCE_TAG[b.OFFICIAL_SNAPSHOT])")
          RESEARCH_LABEL=$(python3 -c "import sys; sys.path.insert(0,'pipeline'); import build_site as b; print(b.EVIDENCE_TAG[b.RESEARCH_BASED])")
          check "evidence label, official city" "1" "$(grep -cF "$OFFICIAL_LABEL" /tmp/p.html || true)"
          curl -s --max-time 30 https://www.wandroz.com/edinburgh/leith.html -o /tmp/e.html
          check "evidence label, assessed city" "1" "$(grep -cF "$RESEARCH_LABEL" /tmp/e.html || true)"
          [ "$fail" = "0" ] || { echo "::error::production does not match the build — see rollback"; exit 1; }
          echo "production verified against the release build"

      - name: Release summary
        if: always()
        run: |
          {
            echo "### Wandroz production release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| source | \`${SRC_SHA}\` |"
            echo "| release commit | \`${RELEASE_SHA:-not created}\` |"
            echo "| rollback to | \`${PREV_MAIN}\` |"
            echo ""
            echo "Rollback: Vercel dashboard → the deployment for \`${PREV_MAIN}\` → Promote to Production."
          } >> "$GITHUB_STEP_SUMMARY"
