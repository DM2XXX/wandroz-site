name: Refresh Wandroz safety data

# WHAT THIS IS
#   The monthly pull of new official crime data. It runs on GitHub's runners,
#   which have normal outbound internet access, so this — not a Claude session
#   — is where the full, unrestricted fetch to data.police.uk happens.
#
# WHAT IT DELIBERATELY DOES NOT DO: publish.
#   It used to end with `git add data dist` and a push to main, which Vercel
#   auto-deployed. That was a second way into production, running past the QA
#   gate, the reproducibility gate and the one-commit-one-deployment rule that
#   release.yml exists to enforce — and it was the reason the schedule was
#   switched off on 11 September 2026 rather than fixed. Re-enabling the cron
#   with that step still in it would have restored an unattended, ungated path
#   to ~1,800 live pages.
#
#   So it now stops one step short. It fetches, it scores, it builds a
#   candidate and puts that candidate through BOTH gates, and if they pass it
#   parks the refreshed data/ on a branch. Nothing reaches main until someone
#   dispatches release.yml with that branch — the single gated path, unchanged.
#   The gates running here are the point: a month where the upstream feed has
#   changed shape fails on the runner, in a branch, with the report attached,
#   instead of on the live site.
#
#   If you later want the release to follow automatically, that is one extra
#   step calling the release workflow with source_ref=${REFRESH_BRANCH} — a
#   deliberate decision to make, not a default to drift into.

on:
  schedule:
    - cron: "0 6 2 * *"   # 06:00 UTC on the 2nd of each month
  workflow_dispatch: {}

permissions:
  contents: write

env:
  REFRESH_BRANCH: auto/data-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Record the window before the refresh
        run: |
          # Printed so the diff in the summary is readable at a glance: a run
          # that fetched nothing new should show the same window afterwards,
          # and that is a normal outcome, not a failure.
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          b = json.load(open("data/scores/london.json"))["boroughs"][0]
          print("WINDOW_BEFORE=%s" % ",".join(b.get("months_included") or []))
          PY

      - name: Fetch latest official crime data (London)
        run: python pipeline/fetch_london.py

      - name: Recompute London scores
        run: python pipeline/score_london.py

      - name: Fetch Zurich burglary data (Kantonspolizei Zürich, Kreis-level)
        run: python pipeline/fetch_zurich.py
        continue-on-error: true
        # An optional extra layer, not core to the site. The upstream host has
        # moved this file before (confirmed 2 September 2026, 404 at both its
        # old and its CKAN-registered URL), and that must never block London's
        # refresh. fetch_zurich.py also exits 0 on a download/schema failure;
        # this is defence in depth in case that regresses.

      - name: Recompute Zurich burglary scores
        run: python pipeline/score_zurich.py
        continue-on-error: true

      - name: Build a candidate from the refreshed data
        run: |
          mkdir -p candidate
          cp -R pipeline candidate/pipeline
          cp -R data candidate/data
          python3 candidate/pipeline/build_site.py
          echo "candidate pages: $(find candidate/dist -name '*.html' | wc -l)"

      - name: QA gate
        run: python3 candidate/pipeline/qa_full_site.py --dist candidate/dist --report-dir qa_output

      - name: Reproducibility gate
        run: |
          python3 candidate/pipeline/verify_reproducible.py \
            --dist candidate/dist --compare-against dist --report-dir qa_output

      - name: Upload the gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-reports
          path: qa_output/

      - name: Record the window after the refresh
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          b = json.load(open("data/scores/london.json"))["boroughs"][0]
          print("WINDOW_AFTER=%s" % ",".join(b.get("months_included") or []))
          PY

      - name: Park the refreshed data on a branch
        run: |
          rm -rf candidate
          git config user.name "wandroz-bot"
          git config user.email "bot@wandroz.com"
          # data/ only. dist/ is not committed here on purpose: release.yml
          # rebuilds it from source so that what ships can never be an artefact
          # someone (or some cron) committed by hand.
          git add -A data
          if git diff --cached --quiet; then
            echo "REFRESHED=no" >> "$GITHUB_ENV"
            echo "Nothing new upstream this month — data is unchanged."
            exit 0
          fi
          echo "REFRESHED=yes" >> "$GITHUB_ENV"
          git commit -m "Automated data refresh ($(date -u +%Y-%m-%d))"
          git push --force origin HEAD:"$REFRESH_BRANCH"
          echo "Parked on $REFRESH_BRANCH"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Wandroz data refresh"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| window before | \`${WINDOW_BEFORE:-?}\` |"
            echo "| window after | \`${WINDOW_AFTER:-?}\` |"
            echo "| new data | ${REFRESHED:-gate failed} |"
            echo "| branch | \`${REFRESH_BRANCH}\` |"
            echo ""
            if [ "${REFRESHED:-}" = "yes" ]; then
              echo "Both gates passed. To publish, run **Production release** with"
              echo "\`source_ref=${REFRESH_BRANCH}\` and \`confirm=RELEASE\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
