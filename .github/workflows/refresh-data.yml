name: Refresh Wandroz safety data

# Runs monthly, plus can be triggered manually. This runs on GitHub's own
# runners, which have normal outbound internet access (unlike the Claude
# Cowork sandbox this pipeline was originally prototyped in) — so this is
# where the FULL, unrestricted data pull to data.police.uk should happen,
# not in a Claude session.
on:
  schedule:
    - cron: "0 6 2 * *"   # 06:00 UTC on the 2nd of each month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch latest official crime data
        run: python pipeline/fetch_london.py
        # Pulls the full monthly response (not a truncated sample) from
        # data.police.uk for each borough centroid, via a real HTTP client.
        # This is the FIRST real run of this script on unrestricted
        # network — watch this step's log the first time it runs to
        # confirm record counts look sane (see pipeline/fetch_london.py's
        # docstring for the known point/radius-vs-polygon limitation).

      - name: Recompute safety scores
        run: python pipeline/score_london.py

      - name: Fetch Zurich burglary data (Kantonspolizei Zürich, Kreis-level)
        run: python pipeline/fetch_zurich.py
        # Narrow, real, genuinely-updated dataset (burglaries only, 12
        # Stadtkreise, not the 34-Quartier map) — see pipeline/fetch_zurich.py's
        # docstring for why this dataset and not Zurich's stale general PKS one.
        continue-on-error: true
        # This is an optional bonus data layer, not core to the site (see
        # fetch_zurich.py's own docstring). The upstream host has moved/
        # renamed this specific file before (confirmed 2 September 2026,
        # KTZH_00002042_00004083.csv 404ing at both its old and its
        # current CKAN-registered URL) — a failure here should never
        # block London's core monthly refresh or the site rebuild/commit
        # below. fetch_zurich.py itself also now exits 0 (not 1) on a
        # download/schema failure for the same reason; continue-on-error
        # here is defense in depth in case that ever regresses.

      - name: Recompute Zurich burglary scores
        run: python pipeline/score_zurich.py
        continue-on-error: true
        # Same reasoning as the fetch step above — if there was nothing
        # new to fetch this run, this step should be a no-op, but this
        # stays non-blocking regardless.

      - name: Rebuild static site
        run: python pipeline/build_site.py

      - name: Commit updated data + site if changed
        run: |
          git config user.name "wandroz-bot"
          git config user.email "bot@wandroz.com"
          git add data dist
          git diff --cached --quiet || git commit -m "Automated monthly data refresh"
          git push
